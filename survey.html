<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>설문 조사 | 사회및행동과학연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17213a;--muted:#5b6580;--bg:#f2f5fa;--surface:#fff;--line:#d9e0ec;
  --navy:#0e2a6b;--soft:#dae3f3;--red:#c00000;--teal:#17414f;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.cover{border-top:10px solid var(--navy)}
.org{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.02em;margin:0 0 6px}
h1{font-size:23px;line-height:1.35;margin:0 0 10px;text-wrap:balance}
.desc{white-space:pre-wrap;color:var(--muted);font-size:15px;margin:0}
.meta{font-size:13px;color:var(--muted);margin-top:12px}
.req{color:var(--red)}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .25s}
.sec{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:12px 20px;font-weight:700}
.sec-d{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 20px;color:var(--muted);font-size:14px;margin-top:-12px}
.q{scroll-margin-top:16px}
.q .t{font-weight:500;margin:0 0 12px;color:var(--teal)}
.q.err{border-color:var(--red)}
.q .em{display:none;color:var(--red);font-size:13px;margin-top:8px}
.q.err .em{display:block}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .btns{display:grid;gap:6px}
.scale button{font:inherit;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.scale .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:6px}
.opt:has(input:checked){border-color:var(--navy);background:var(--soft)}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--navy);flex:none}
.other{margin:-2px 0 6px 40px;display:none}
.other.show{display:block}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-within{outline:2px solid var(--navy);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:12px 22px;border:1.5px solid var(--navy);background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface);color:var(--navy)}
.btn:disabled{opacity:.5;cursor:wait}
.notice{font-size:13.5px;background:var(--soft);color:var(--navy);border-radius:8px;padding:10px 14px}
.notice.bad{background:#fbe9e9;color:var(--red)}
.done{text-align:center;padding:36px 20px}
.done .big{font-size:22px;font-weight:900;color:var(--navy);margin:0 0 8px}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.stim{background:var(--soft);border-left:5px solid var(--navy);border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:15px}
.consent{white-space:pre-wrap;font-size:14.5px;max-height:none}
.irb{font-size:12.5px;color:var(--muted);margin-top:10px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.hub{grid-template-columns:1fr}}
.hub a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:20px}
.hub a:hover,.hub a:focus-visible{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--soft)}
.hub .k{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.hub b{font-size:18px;color:var(--navy)}
.hub span.d{font-size:13.5px;color:var(--muted)}
.hub .go{margin-top:auto;font-weight:700;color:var(--navy);font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">설문을 불러오는 중입니다…</div></div>

<script>
(function(){
/* 처음 한 번 설정: 링크에 응답 수집 주소가 없을 때 쓸 기본 주소 (비워 두어도 됩니다) */
const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbwHLcYk15dyBXeeLEnEEpRsL7YkopAPLkYKfLNn-JXHk2vuBJ8MTlpL544NSbZxnwc1FA/exec";

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function b64urlToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decode(hash){
  const kind=hash[0],data=b64urlToBytes(hash.slice(1));
  if(kind==="z"){
    const ds=new DecompressionStream("deflate-raw");
    const txt=await new Response(new Blob([data]).stream().pipeThrough(ds)).text();
    return JSON.parse(txt);
  }
  if(kind==="j")return JSON.parse(new TextDecoder().decode(data));
  throw new Error("unknown");
}
function fail(msg){app.innerHTML=`<div class="card cover"><h1>설문을 열 수 없습니다</h1><p class="desc">${esc(msg)}</p></div>`}

let S,ans=[],ord=[],page=-1,started=Date.now(),consented=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

async function init(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h){hub();return}
  if(h.length<64){
    // 짧은 링크: 설문 내용을 응답 시트에서 불러옵니다
    try{
      const r=await fetch(DEFAULT_ENDPOINT+"?id="+encodeURIComponent(h.toLowerCase()));
      const j=await r.json();
      if(!j.ok){fail("등록되지 않은 설문 주소입니다. 받으신 링크의 철자를 확인해 주세요.");return}
      S=j.survey;
    }catch(e){fail("설문을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.");return}
  }else{
    try{S=await decode(h)}catch(e){fail("설문 링크가 잘렸거나 손상되었습니다. 받으신 링크를 처음부터 끝까지 다시 복사해 열어 주세요.");return}
  }
  if(!S||!Array.isArray(S.s)){fail("설문 내용을 읽지 못했습니다.");return}
  S.e=S.e||DEFAULT_ENDPOINT;
  document.title=(S.t||"설문 조사")+(S.o?" | "+S.o:"");
  ans=S.s.map(sec=>sec.q.map(()=>null));
  ord=S.s.map(sec=>{const a=sec.q.map((_,i)=>i);if(sec.rn){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}return a});
  render();
}

function total(){return S.s.reduce((a,s)=>a+s.q.length,0)}
function render(){
  const n=S.s.length;
  if(page<0){
    const already=store.get("sv_done_"+S.id);
    app.innerHTML=`<div class="card cover">
      ${S.o?`<p class="org">${esc(S.o)}</p>`:""}
      <h1>${esc(S.t||"설문 조사")}</h1>
      <p class="desc">${esc(S.d||"")}</p>
      ${S.irb?`<p class="irb">IRB 승인번호 ${esc(S.irb)}</p>`:""}
      <p class="meta">총 ${total()}문항 · 약 ${Math.max(1,Math.round(total()*10/60))}분 · <span class="req">*</span> 표시는 필수 응답</p>
    </div>
    ${already?`<div class="notice">이 기기에서 이미 응답을 제출하셨습니다. 다시 응답하시면 별도 응답으로 기록됩니다.</div>`:""}
    ${S.e?"":`<div class="notice bad">응답 수집 주소가 연결되지 않은 설문입니다. 설문을 보낸 곳에 문의해 주세요.</div>`}
    <div class="nav"><span></span><button class="btn" id="start" ${S.e?"":"disabled"}>설문 시작</button></div>`;
    document.getElementById("start").onclick=()=>{if(S.c&&!consented)consentPage();else{page=0;render()}window.scrollTo(0,0)};
    footer();return;
  }
  const sec=S.s[page];
  app.innerHTML=`<div class="progress" aria-hidden="true"><i style="width:${(page/n*100).toFixed(1)}%"></i></div>
    <div class="sec">${page+1}. ${esc(sec.t)}</div>
    <div class="sec-d">이어서 아래 ${sec.q.length}개의 질문에 응답하여 주세요.</div>
    ${sec.i?`<div class="stim">${esc(sec.i)}</div>`:""}
    ${ord[page].map((i,k)=>qHTML(sec.q[i],i,k+1)).join("")}
    <div class="hp" aria-hidden="true"><label>비워 두세요<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
    <div class="notice bad" id="sendErr" hidden></div>
    <div class="nav">
      <button class="btn ghost" id="prev">${page===0?"처음으로":"이전"}</button>
      <button class="btn" id="next">${page===n-1?"제출하기":"다음"}</button>
    </div>`;
  bind(sec);footer();
}
function qHTML(q,i,no){
  const id=`q${page}_${i}`,v=ans[page][i],req=q.r?' <span class="req">*</span>':"";
  let body="";
  if(q.y==="scale"||q.y==="nps"){
    const [a,b,l,r]=q.y==="scale"?[1,7,"전혀 그렇지 않다","매우 그렇다"]:[0,10,"전혀 추천하지 않는다","매우 추천한다"];
    let btn="";for(let k=a;k<=b;k++)btn+=`<button type="button" data-v="${k}" aria-pressed="${v===k}" aria-label="${k}점">${k}</button>`;
    body=`<div class="scale" role="group" aria-labelledby="${id}_t"><div class="btns" style="grid-template-columns:repeat(${b-a+1>7?6:7},1fr)">${btn}</div><div class="ends"><span>${a} ${l}</span><span>${b} ${r}</span></div></div>`;
  }else if(q.y==="choice"||q.y==="checkbox"){
    const type=q.y==="choice"?"radio":"checkbox";
    const sel=Array.isArray(v)?v:(v!=null?[v]:[]);
    body=(q.o||[]).map((o,k)=>{
      const isOther=o==="기타";
      const checked=sel.some(x=>x===o||(isOther&&String(x).startsWith("기타:")));
      const otherVal=isOther?(sel.find(x=>String(x).startsWith("기타:"))||"").replace(/^기타:\s*/,""):"";
      return `<label class="opt"><input type="${type}" name="${id}" value="${esc(o)}" ${checked?"checked":""}><span>${esc(o)}</span></label>
        ${isOther?`<div class="other ${checked?"show":""}"><input type="text" data-other="${id}" placeholder="직접 입력" value="${esc(otherVal)}" aria-label="기타 내용"></div>`:""}`;
    }).join("");
  }else if(q.y==="text"){
    body=`<input type="text" id="${id}" value="${esc(v||"")}" aria-labelledby="${id}_t">`;
  }else{
    body=`<textarea id="${id}" aria-labelledby="${id}_t">${esc(v||"")}</textarea>`;
  }
  return `<div class="card q" id="${id}_c"><p class="t" id="${id}_t">${no}. ${esc(q.x)}${req}</p>${body}<p class="em">응답해 주세요.</p></div>`;
}
function bind(sec){
  sec.q.forEach((q,i)=>{
    const id=`q${page}_${i}`,c=document.getElementById(id+"_c");
    if(q.y==="scale"||q.y==="nps"){
      c.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{
        ans[page][i]=+b.dataset.v;c.querySelectorAll("button[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));c.classList.remove("err");
      });
    }else if(q.y==="choice"||q.y==="checkbox"){
      const read=()=>{
        const vals=[...c.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>{
          if(x.value==="기타"){const t=c.querySelector(`[data-other="${id}"]`).value.trim();return t?"기타: "+t:"기타"}
          return x.value;
        });
        const o=c.querySelector(".other");if(o)o.classList.toggle("show",!!c.querySelector(`input[name="${id}"][value="기타"]:checked`));
        ans[page][i]=q.y==="choice"?(vals[0]??null):(vals.length?vals:null);
        c.classList.remove("err");
      };
      c.querySelectorAll("input").forEach(x=>x.addEventListener(x.type==="text"?"input":"change",read));
    }else{
      const el=document.getElementById(id);el.oninput=()=>{ans[page][i]=el.value.trim()||null;c.classList.remove("err")};
    }
  });
  document.getElementById("prev").onclick=()=>{if(page===0&&S.c)consentPage();else{page--;render()}window.scrollTo(0,0)};
  document.getElementById("next").onclick=()=>{
    const bad=ord[page].filter(i=>sec.q[i].r&&(ans[page][i]==null||ans[page][i]===""));
    bad.forEach(i=>document.getElementById(`q${page}_${i}_c`).classList.add("err"));
    if(bad.length){document.getElementById(`q${page}_${bad[0]}_c`).scrollIntoView({behavior:"smooth",block:"start"});return}
    if(page<S.s.length-1){page++;render();window.scrollTo(0,0)}else submit();
  };
}
async function submit(){
  const btn=document.getElementById("next"),err=document.getElementById("sendErr");
  btn.disabled=true;btn.textContent="제출 중…";err.hidden=true;
  const headers=[],answers=[],notes=[],codebook=[];
  const research=S.m==="r";
  const TY={scale:"1~7점",nps:"0~10점",choice:"단일선택",checkbox:"복수선택",text:"단답",paragraph:"서술"};
  if(research&&S.c){headers.push("CONSENT");answers.push("동의");notes.push("연구 참여 동의");codebook.push(["CONSENT","동의서","연구 참여 동의","","","",""])}
  S.s.forEach((sec,si)=>sec.q.forEach((q,qi)=>{
    const h=research&&q.c?q.c:`${si+1}-${qi+1}. ${q.x}`;
    headers.push(h);answers.push(ans[si][qi]??"");notes.push(q.x);
    codebook.push([h,`${si+1}. ${sec.t}`,q.x,q.k||"",q.v?"역문항":"",q.n||(q.o?q.o.join(" / "):""),TY[q.y]||q.y]);
  }));
  headers.push(research?"DURATION":"응답 소요(초)");answers.push(Math.round((Date.now()-started)/1000));notes.push("응답 소요 시간(초)");
  codebook.push([research?"DURATION":"응답 소요(초)","","응답 소요 시간(초)","","","","숫자"]);
  const payload={id:S.id,title:S.t,headers,answers,hp:(document.getElementById("hp")||{}).value||""};
  if(research){payload.notes=notes;payload.codebook=codebook}
  const body=JSON.stringify(payload);
  let ok=false;
  // 한 번만 보냅니다(중복 기록 방지). 네트워크가 끊기면 오류가 나고, 다시 제출할 수 있습니다.
  try{await fetch(S.e,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body});ok=true}
  catch(e){ok=false}
  if(ok){
    store.set("sv_done_"+S.id,"1");
    app.innerHTML=`<div class="progress" aria-hidden="true"><i style="width:100%"></i></div><div class="card cover done"><p class="big">응답해 주셔서 감사합니다</p><p class="desc">소중한 의견이 정상적으로 제출되었습니다.</p></div>`;
    footer();window.scrollTo(0,0);
  }else{
    btn.disabled=false;btn.textContent="다시 제출하기";
    err.hidden=false;err.textContent="제출하지 못했습니다. 인터넷 연결을 확인한 뒤 ‘다시 제출하기’를 눌러 주세요. 작성하신 내용은 그대로 남아 있습니다.";
  }
}
function consentPage(){
  page=-1;
  app.innerHTML=`<div class="sec">연구 참여 동의서</div>
    <div class="card" style="border-radius:0 0 12px 12px;margin-top:-12px"><div class="consent">${esc(S.c)}</div>
    ${S.irb?`<p class="irb">IRB 승인번호 ${esc(S.irb)}</p>`:""}</div>
    <div class="card q" id="cs_c"><p class="t">위 내용을 읽고 이해하였으며, 연구에 참여하는 데 동의하십니까? <span class="req">*</span></p>
      <label class="opt"><input type="radio" name="cs" value="y" ${consented?"checked":""}><span>네, 동의합니다.</span></label>
      <label class="opt"><input type="radio" name="cs" value="n"><span>아니요, 동의하지 않습니다.</span></label>
      <p class="em">동의 여부를 선택해 주세요.</p></div>
    <div class="nav"><button class="btn ghost" id="cback">처음으로</button><button class="btn" id="cnext">다음</button></div>`;
  footer();
  document.getElementById("cback").onclick=()=>{page=-1;render();window.scrollTo(0,0)};
  document.getElementById("cnext").onclick=()=>{
    const v=(document.querySelector('input[name="cs"]:checked')||{}).value;
    if(!v){document.getElementById("cs_c").classList.add("err");return}
    if(v==="n"){app.innerHTML=`<div class="card cover done"><p class="big">참여해 주셔서 감사합니다</p><p class="desc">연구 참여에 동의하지 않으셔서 설문을 종료합니다. 어떤 정보도 저장되지 않았습니다.</p></div>`;footer();window.scrollTo(0,0);return}
    consented=true;page=0;render();window.scrollTo(0,0);
  };
}
function hub(){
  document.title="설문 빌더 | 사회및행동과학연구소";
  app.innerHTML=`<div class="card cover"><p class="org">(주)사회및행동과학연구소</p><h1>설문 빌더</h1><p class="desc">만들 설문의 종류를 고르세요. 완성된 설문 링크로 들어온 응답은 연결된 구글 시트에 모입니다.</p></div>
  <div class="hub">
    <a href="/survey-builder"><span class="k">CUSTOMER</span><b>만족도 설문 빌더</b><span class="d">제품·서비스 카테고리별 표준 문항을 골라 고객 만족도 조사를 만듭니다.</span><span class="go">열기 →</span></a>
    <a href="/research-builder"><span class="k">RESEARCH</span><b>연구 설문 빌더</b><span class="d">척도 라이브러리, 동의서, 변수명·코드북이 갖춰진 학술 연구용 설문을 만듭니다.</span><span class="go">열기 →</span></a>
  </div>
  <p class="meta" style="text-align:center">설문에 응답하러 오셨다면 받으신 설문 링크 전체로 접속해 주세요.</p>`;
  footer();
}
function footer(){
  const f=document.createElement("footer");f.textContent="Survey powered by (주)사회및행동과학연구소";app.appendChild(f);
}
window.addEventListener("hashchange",()=>{page=-1;init()});
init();
})();
</script>
</body>
</html>
